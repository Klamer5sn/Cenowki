.brand-name{font-size:24px}

.hero{margin:8px 0 18px}
.hero h1{font-size:clamp(30px,3.8vw,48px)}
.sectionbar{margin:18px 0 10px}
.overview{grid-template-columns:1fr;gap:12px}
.panel,.next-panel{border-radius:22px}

.next-count{font-size:clamp(34px,4vw,48px);margin-top:8px}

.compact-panel{padding:16px 18px}
.compact-list{display:grid;gap:0}
.compact-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.compact-row:first-child{padding-top:0;border-top:0}
.compact-main{min-width:0;flex:1}
.compact-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:770;letter-spacing:-.03em;line-height:1.25}
.compact-meta{margin-top:4px;font-size:12px;color:var(--sub);line-height:1.45}
.person-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.person-dot.felek{background:var(--mint)}
.person-dot.tymon{background:var(--violet)}
.compact-side{min-width:72px;text-align:right;align-self:center}
.compact-side strong{display:block;font-size:18px;font-weight:790;letter-spacing:-.05em}
.compact-side small{display:block;color:#8b96a5;font-size:10px;font-weight:740;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.small-empty{border:0;background:transparent;padding:8px 0 2px;text-align:left;color:#7a8392;line-height:1.6}
.summary-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.summary-mini{border:1px solid var(--hair);border-radius:16px;padding:12px 13px;background:#fbfcfe}
.summary-mini b{display:block;font-size:20px;font-weight:790;letter-spacing:-.05em}
.summary-mini span{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.activity-grid,.transport-list{gap:10px}
.activity-card{min-height:0;padding:14px 15px;gap:6px;border-radius:18px}
.activity-title{font-size:17px}
.transport-card{min-height:84px;padding:13px 14px;border-radius:16px}
.transport-icon{height:42px;min-width:42px;border-radius:13px}
.lesson-footer{font-size:11px}
@media(max-width:850px){.summary-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:580px){.hero{margin:0 1px 16px}.sectionbar{margin:16px 2px 9px}.next-panel{padding:18px 18px}.compact-panel{padding:14px 15px}.compact-title{font-size:14px}.compact-meta{font-size:11px}.compact-side{min-width:58px}.compact-side strong{font-size:16px}.summary-strip{grid-template-columns:1fr 1fr 1fr;gap:8px}.summary-mini{padding:10px 10px}.summary-mini b{font-size:17px}.activity-card{padding:13px 13px}.transport-card{padding:12px 13px}}

function rdDiff(a,b){
 const ops=[];
 const before=new Map((a.events||[]).map(e=>[e.id,e]));
 const after=new Map((b.events||[]).map(e=>[e.id,e]));
 for(const [id,e] of after)if(!before.has(id)||rdEventJSON(before.get(id))!==rdEventJSON(e))ops.push({type:'upsert',event:e});
 for(const [id] of before)if(!after.has(id))ops.push({type:'delete',id});

 for(const id of keys){const aa=!!a.cancelled?.[id],bb=!!b.cancelled?.[id];if(aa!==bb)ops.push({type:'cancel',id,active:bb});}
 if(a.buffer!==b.buffer)ops.push({type:'buffer',value:Number(b.buffer)});

}
async function rdFetch(method='GET',ops){

 try{

function renderPriority(){
  // OBA BOKSY SĄ ZWIĄZANE WYŁĄCZNIE Z DNIEM WYBRANYM W KALENDARZU.
  const selected=selectedDate, now=new Date(),todayStr=dateStr(now),isToday=selected===todayStr,isPastDay=selected<todayStr;
  const all=actualEvents(selected,'both').filter(e=>!e.cancelled);
  const extra=all.filter(e=>e.kind==='extra');
  const nowMinute=minNow();
  const ongoing=isToday?all.filter(e=>minutes(e.start)<=nowMinute&&minutes(e.end)>nowMinute):[];
  const futureExtras=isToday?extra.filter(e=>minutes(e.start)>nowMinute):extra;
  const day=dateFrom(selected),dayTag=DAYS[day.getDay()]+' · '+dateFriendly(day);
  let first=[],firstMode='scheduled',second=null;

  if(ongoing.length){
    // Pokaż wszystkie aktualnie trwające zajęcia, także lekcje szkolne chłopaków.
    first=ongoing;
    firstMode='active';
    second=futureExtras[0]||null;
  }else if(futureExtras.length){
    first=[futureExtras[0]];
    firstMode=isToday?'upcoming':'scheduled';
    second=futureExtras.length>1?futureExtras[1]:null;
  }else if(isToday&&extra.length){
    // Po ostatnich zajęciach pokaż rzeczywiste zakończone wydarzenie, nie pusty boks.
    first=[extra[extra.length-1]];
    firstMode='completed';
  }else if(all.length){
    // Gdy nie ma zajęć dodatkowych, ale były lekcje, pokaż ostatnią lekcję.
    first=[all[all.length-1]];
    firstMode=isToday?'completed':'scheduled';
  }

  // Przy braku wydarzeń w wybranym dniu ukryj całe karty; nie pokazuj „Teraz bez zajęć”.
  const liveMount=$('#liveNow'),upcomingMount=$('#upcoming');
  if(!first.length){liveMount.innerHTML='';upcomingMount.innerHTML='';return;}

  const heading=firstMode==='active'?'TRWA TERAZ':firstMode==='upcoming'?'NAJBLIŻSZE DZISIAJ':firstMode==='completed'?'OSTATNIE ZAJĘCIA':'PIERWSZE ZAJĘCIA';
  const badge=isToday?now.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}):dayTag;
  const liveRows=first.map(e=>{
    const place=e.kind==='school'?'s. '+(e.room||'niepodana'):(e.place||'miejsce niepodane');
    const remains=minutes(e.end)-nowMinute;
    const total=Math.max(1,minutes(e.end)-minutes(e.start));
    const elapsed=Math.max(0,Math.min(100,100*(nowMinute-minutes(e.start))/total));
    const transport=e.kind==='extra'&&e.transport==='pickup'?'Odbiór o '+e.end+(e.driver?' · '+e.driver:''):
      e.kind==='extra'&&e.transport==='drop'?'Wozi: '+(e.driver||'nieustalone'):'';
    const mainMetric=firstMode==='active'?Math.max(1,remains)+' min':
      (firstMode==='upcoming'||firstMode==='scheduled')?(isPastDay?e.start:compactRemaining(ts(day,e.start)-now.getTime())):
      firstMode==='completed'?'Koniec '+e.end:e.start;
    const metricLabel=firstMode==='active'?'do końca':(firstMode==='upcoming'||firstMode==='scheduled')?(isPastDay?'godzina startu':'do rozpoczęcia'):firstMode==='completed'?'zakończone':'początek';
    return '<div class="live-event">'+avatar(e.kid,'large')+
      '<div class="live-information"><div class="live-name">'+esc(names[e.kid]+' · '+e.title)+'</div>'+ 
      '<div class="live-meta">'+esc(e.start+'–'+e.end+' · '+place)+'</div>'+ 
      (transport?'<div class="live-action">'+esc(transport)+'</div>':'')+'</div>'+ 
      '<div class="live-remaining"><strong>'+esc(mainMetric)+'</strong><small>'+esc(metricLabel)+'</small></div></div>'+ 
      (firstMode==='active'?'<div class="live-progress"><span style="width:'+elapsed.toFixed(1)+'%"></span></div>':'');
  }).join('');
  liveMount.innerHTML='<article class="priority-card live-card"><div class="priority-head"><div class="priority-kicker"><span class="pulse"></span>'+heading+'</div><span class="priority-clock">'+esc(badge)+'</span></div><div class="live-events '+(first.length>1?'multiple':'')+'">'+liveRows+'</div></article>';

  if(!second){upcomingMount.innerHTML='';return;}
  const countdown=isPastDay?second.start:compactRemaining(ts(day,second.start)-now.getTime());
  const log=second.transport==='drop'?'Wozi: '+(second.driver||'nieustalone'):
    second.transport==='pickup'?'Odbiór o '+second.end+(second.driver?' · '+second.driver:''):'';
  const meta=second.start+'–'+second.end+(second.place?' · '+second.place:'');
  upcomingMount.innerHTML='<article class="priority-card next-card"><div class="priority-head"><div class="priority-kicker"><span class="next-led"></span>KOLEJNE TEGO DNIA</div><button class="remind-icon" data-action="ics" data-id="'+esc(second.id)+'" data-date="'+esc(selected)+'" aria-label="Dodaj do kalendarza" title="Przypomnienie">'+uiIcon('bell')+'</button></div><div class="next-main">'+avatar(second.kid,'large')+'<div class="next-copy"><div class="next-title">'+esc(names[second.kid]+' · '+second.title)+'</div><div class="next-meta">'+esc(meta)+'</div>'+(log?'<div class="next-action">'+esc(log)+'</div>':'')+'</div><div class="live-remaining next-remaining"><strong>'+esc(countdown)+'</strong><small>'+(isPastDay?'godzina startu':'do rozpoczęcia')+'</small></div></div></article>';
}
function compactRemaining(ms){
  const n=Math.max(0,Math.ceil(ms/60000));
  const days=Math.floor(n/1440),hours=Math.floor((n%1440)/60),min=n%60;

  if(hours)return hours+' h '+min+' min';
  return n+' min';
}

function actionTimeOf(e){return e.transport==='pickup'?e.end:e.start}

function extrasFor(date){return actualEvents(date,'both').filter(e=>e.kind==='extra'&&!e.cancelled).map(e=>({...e,date,actionTime:actionTimeOf(e),actionTs:actionWhen(date,e)})).sort((a,b)=>a.actionTs-b.actionTs||minutes(a.start)-minutes(b.start))}
function upcomingExtrasForSelected(){const isToday=selectedDate===dateStr(new Date()),now=Date.now();return extrasFor(selectedDate).filter(e=>!isToday||e.actionTs>=now-60000)}

function statusForDayEvent(e){const isToday=selectedDate===dateStr(new Date());const now=minNow();if(e.cancelled)return ['ODWOŁANE','canceled'];if(isToday&&minutes(e.start)<=now&&minutes(e.end)>now)return ['Trwa','now'];if(isToday&&minutes(e.start)>now)return ['Za '+Math.max(1,minutes(e.start)-now)+' min','next'];if(isToday&&minutes(e.end)<=now)return ['Było','done'];return [e.start,'later'];}
function nextForSelectedDay(){const list=actualEvents(selectedDate,'both').filter(e=>e.kind==='extra'&&!e.cancelled);if(!list.length)return null;const isToday=selectedDate===dateStr(new Date());const now=minNow();const active=list.find(e=>minutes(e.start)<=now&&minutes(e.end)>now);if(active)return {...active,active:true,when:ts(selectedD(),active.end)};if(isToday){const upcoming=list.find(e=>minutes(e.start)>now);if(upcoming)return {...upcoming,when:ts(selectedD(),upcoming.start)};return null}return {...list[0],when:ts(selectedD(),list[0].start)}}

function fieldInputInner(name,label,val,type,required,placeholder){return '<label for="f_'+name+'">'+label+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val||'')+'" placeholder="'+esc(placeholder||'')+'" '+(required?'required':'')+'>'}

function fieldSelect(name,label,val,opts){return '<div class="field"><label for="f_'+name+'">'+label+'</label><select id="f_'+name+'" name="'+name+'">'+opts.map(([v,l])=>'<option value="'+v+'" '+(String(v)===String(val)?'selected':'')+'>'+l+'</option>').join('')+'</select></div>'}
function fieldInput(name,label,val,type,required){return '<div class="field"><label for="f_'+name+'">'+label+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val||'')+'" '+(required?'required':'')+'></div>'}
function saveForm(form){
  const data=new FormData(form),start=String(data.get('start')),end=String(data.get('end'));
  if(minutes(start)>=minutes(end)){toast('Godzina końca musi być późniejsza od początku.');return;}
  const targetDate=String(data.get('eventDate')||'');
  const target=targetDate?dateFrom(targetDate):null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)||!target||dateStr(target)!==targetDate){toast('Wybierz poprawną datę.');return;}
  const weekly=data.get('recurrence')==='weekly';
  const days=[...new Set(data.getAll('weekdays').map(Number))].filter(n=>Number.isInteger(n)&&n>=0&&n<=6);
  if(weekly&&!days.length){toast('Zaznacz przynajmniej jeden dzień tygodnia.');return;}
  const last=weekly?String(data.get('endDate')||''):'';
  if(last&&last<targetDate){toast('Data końcowa nie może być wcześniejsza niż początek.');return;}
  const original=state.events.find(e=>e.id===editId);
  const item={
    id:editId||('user_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),
    dow:weekly?days[0]:target.getDay(),
    kid:String(data.get('kid')),kind:String(data.get('kind')),
    title:String(data.get('title')).trim(),start,end,
    room:String(data.get('room')).trim(),place:String(data.get('place')).trim(),
    transport:String(data.get('transport')),driver:String(data.get('driver')).trim(),
    note:String(data.get('note')).trim(),repeat:weekly?'weekly':'once',
    days:weekly?days:[],
    date:weekly?'':targetDate,
    startDate:weekly?(original&&!original.repeat&&!original.date?'':targetDate):'',
    endDate:weekly?last:''
  };
  if(!item.title){toast('Wpisz nazwę wydarzenia.');return;}
  const idx=state.events.findIndex(e=>e.id===editId);
  if(idx<0)state.events.push(item);else state.events[idx]=item;
  persist();closeModal();
  let displayDate=target;
  if(weekly&&!days.includes(target.getDay())){
    for(let delta=1;delta<=7;delta++){const candidate=addDays(target,delta);if(days.includes(candidate.getDay())&&(!last||dateStr(candidate)<=last)){displayDate=candidate;break;}}
  }
  selectedDate=dateStr(displayDate);weekStart=monday(displayDate);autoToday=selectedDate===dateStr(new Date());
  renderAll();toast(weekly?'Zapisano powtarzające się wydarzenie.':'Dodano wydarzenie do kalendarza.');
}

function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function stamp(date,time){return date.replace(/-/g,'')+'T'+time.replace(':','')+'00'}
function createICS(events,filename,recur){if(!events.length){toast('Brak zajęć do zapisania.');return}const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//R.D. Family//PL','CALSCALE:GREGORIAN','METHOD:PUBLISH'];for(const {e,date} of events){const st=stamp(date,e.start),en=stamp(date,e.end);out.push('BEGIN:VEVENT','UID:'+e.id+'-'+date+'@rytm.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),'DTSTART:'+st,'DTEND:'+en,'SUMMARY:'+icsEscape(names[e.kid]+' · '+e.title),'DESCRIPTION:'+icsEscape([e.note,e.transport==='drop'?'Dowóz: '+(e.driver||'osoba niepodana'):e.transport==='pickup'?'Odbiór: '+(e.driver||'osoba niepodana'):''].filter(Boolean).join(' | ')),'LOCATION:'+icsEscape(e.place||e.room&&('Sala '+e.room)||''));if(recur&&e.repeat!=='once'&&!e.date)out.push('RRULE:FREQ=WEEKLY'+(e.endDate?';UNTIL='+e.endDate.replace(/-/g,'')+'T235959':''));out.push('BEGIN:VALARM','TRIGGER:-PT'+Number(state.buffer)+'M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Zbliżają się zajęcia: '+names[e.kid]+' · '+e.title),'END:VALARM','END:VEVENT')}out.push('END:VCALENDAR');download(filename,out.join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('Plik kalendarza gotowy. Otwórz go, aby dodać przypomnienie.');}
function oneICS(id,date){const e=state.events.find(x=>x.id===id);if(!e)return;if(state.cancelled[date+'_'+id]){toast('To wydarzenie jest odwołane.');return}createICS([{e,date}], 'przypomnienie-'+e.kid+'-'+date+'.ics',false)}
function exportICS(){const base=dateFrom(selectedDate),list=[];for(let i=0;i<7;i++){const date=addDays(monday(base),i),ds=dateStr(date);actualEvents(ds,'both').filter(e=>e.kind==='extra'&&!e.cancelled).forEach(e=>list.push({e,date:ds}));}createICS(list,'rytm-zajecia-tygodniowe.ics',true)}
let lastRenderedMinute='';function tick(){const d=new Date(),m=dateStr(d)+' '+d.getHours()+':'+d.getMinutes();if(autoToday&&selectedDate!==dateStr(d)){selectedDate=dateStr(d);weekStart=monday(d);}if(m!==lastRenderedMinute){lastRenderedMinute=m;renderAll();}}
document.addEventListener('submit',e=>{if(e.target.id==='eventForm'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('change',e=>{
 if(e.target.id==='buffer'){state.buffer=Number(e.target.value);persist();toast('Zmieniono czas przypomnienia.');}
 if(e.target.name==='recurrence'){const opt=$('#weeklyOptions');if(opt)opt.classList.toggle('hide',e.target.value!=='weekly');}
 if(e.target.id==='f_eventDate'&&modalType==='form'&&!editId){const chosen=dateFrom(e.target.value);if(chosen&&dateStr(chosen)===e.target.value){const checks=[...document.querySelectorAll('input[name=weekdays]')];const currently=checks.filter(c=>c.checked);if(currently.length===1){currently[0].checked=false;const current=checks.find(c=>Number(c.value)===chosen.getDay());if(current)current.checked=true;}}}
});
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-action]');if(!trigger)return;const action=trigger.dataset.action,val=trigger.dataset.value,id=trigger.dataset.id;if(action==='backdrop'){if(e.target===trigger)closeModal();return}if(action==='close-modal'){closeModal();return}if(action==='date'){selectedDate=val;weekStart=monday(dateFrom(val));autoToday=val===dateStr(new Date());renderAll();return}if(action==='shift-week'){const d=addDays(selectedD(),Number(val));weekStart=monday(d);selectedDate=dateStr(d);autoToday=selectedDate===dateStr(new Date());renderAll();return}if(action==='go-today'){selectedDate=dateStr(new Date());weekStart=monday(new Date());autoToday=true;renderAll();return}if(action==='open-manage'){openModal('manage');return}if(action==='new'){openModal('form');return}if(action==='edit'){openModal('form',id);return}if(action==='close-modal'){closeModal();return}if(action==='cancel'){const key=selectedDate+'_'+id;state.cancelled[key]=!state.cancelled[key];if(!state.cancelled[key])delete state.cancelled[key];persist();renderAll();if(modalType==='manage')renderModal();toast(state.cancelled[key]?'Odwołano tylko w tym dniu.':'Przywrócono zajęcia.');return}if(action==='delete'){if(!editId)return;if(confirm('Usunąć to wydarzenie ze wszystkich tygodni?')){state.events=state.events.filter(v=>v.id!==editId);persist();closeModal();renderAll();toast('Usunięto wydarzenie.')}return}if(action==='ics'){oneICS(id,trigger.dataset.date||selectedDate);return}if(action==='export-ics'){exportICS();return}if(action==='reset'){if(confirm('Przywrócić pierwotny plan ze zdjęcia? Wszystkie lokalne zmiany i odwołania zostaną usunięte.')){state=defaults();persist();closeModal();renderAll();toast('Przywrócono plan ze zdjęcia.')}return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalType)closeModal();if((e.key==='Enter'||e.key===' ')&&(e.target.classList.contains('lesson-cell')||e.target.classList.contains('agenda-item'))&&e.target.dataset.action==='edit'){e.preventDefault();openModal('form',e.target.dataset.id)}});
renderAll();rdStart();setInterval(tick,15000);setInterval(rdRefreshCycle,12000);window.addEventListener('online',rdRefreshCycle);window.addEventListener('focus',rdRefreshCycle);
})();
</script>
